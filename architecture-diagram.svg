<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#D70466"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="eventGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowPrimary" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF385C"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <rect width="42" height="42" rx="10" fill="url(#primaryGrad)"/>
    <path d="M21 9c2.6 0 4.5 1.2 6.1 4.2l.7 1.3c2.5 4.9 7.8 16.1 9.1 19l.2.5c.9 2 1.2 3.2 1.2 4.4 0 5.5-4.2 9.9-9.6 9.9-4.1 0-6.8-2.1-7.7-5-1 2.9-3.6 5-7.7 5-5.5 0-9.6-4.4-9.6-9.9 0-1.4.4-2.8 1.4-5.3l.4-.9c1.3-2.9 6.6-14.1 9.1-19l.7-1.3C16.5 10.2 18.4 9 21 9z" transform="scale(0.5) translate(8, 8)" fill="#FFFFFF"/>
    <text x="56" y="22" fill="#F8FAFC" font-size="22" font-weight="800" letter-spacing="-0.5">AIRBNB-SCALE VACATION RENTAL MARKETPLACE</text>
    <text x="56" y="40" fill="#94A3B8" font-size="13" font-weight="500">Production Distributed Architecture &amp; Global Scaling Blueprint</text>
  </g>

  <!-- LAYER 1: CLIENTS & GLOBAL EDGE (Y: 100 - 220) -->
  <g transform="translate(60, 110)">
    <!-- Container Box -->
    <rect width="1280" height="110" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="24" y="30" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1">LAYER 1: CLIENT APPLICATIONS &amp; ANYCAST EDGE NETWORK</text>

    <!-- Client Apps -->
    <g transform="translate(24, 45)">
      <rect width="260" height="50" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <circle cx="25" cy="25" r="10" fill="#FF385C"/>
      <text x="45" y="24" fill="#F1F5F9" font-size="13" font-weight="600">Web / Mobile / Tablet</text>
      <text x="45" y="38" fill="#94A3B8" font-size="11">React SPA / Next.js SSR / iOS &amp; Android</text>
    </g>

    <!-- Cloudflare Edge / WAF -->
    <g transform="translate(340, 45)">
      <rect width="280" height="50" rx="8" fill="url(#edgeGrad)"/>
      <text x="20" y="24" fill="#FFFFFF" font-size="13" font-weight="700">Cloudflare Anycast CDN &amp; WAF</text>
      <text x="20" y="38" fill="#BAE6FD" font-size="11">DDoS Mitigation · Edge TLS 1.3 · Bot Shield</text>
    </g>

    <!-- Dynamic Edge Cache & Image Resizer -->
    <g transform="translate(670, 45)">
      <rect width="290" height="50" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="20" y="24" fill="#F1F5F9" font-size="13" font-weight="600">Edge Image Optimizer</text>
      <text x="20" y="38" fill="#94A3B8" font-size="11">WebP/AVIF Transcoding · On-demand Resize</text>
    </g>

    <!-- Global DNS / Traffic Manager -->
    <g transform="translate(1010, 45)">
      <rect width="245" height="50" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="20" y="24" fill="#F1F5F9" font-size="13" font-weight="600">Route 53 Geolocation Routing</text>
      <text x="20" y="38" fill="#94A3B8" font-size="11">Multi-Region Latency Based Failover</text>
    </g>
  </g>

  <!-- LAYER 2: API GATEWAY & BFF (Y: 250 - 360) -->
  <g transform="translate(60, 250)">
    <rect width="1280" height="100" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="24" y="28" fill="#C084FC" font-size="12" font-weight="700" letter-spacing="1">LAYER 2: SECURITY, API GATEWAY &amp; BACKEND-FOR-FRONTEND (BFF)</text>

    <!-- Gateway Core -->
    <g transform="translate(24, 40)">
      <rect width="320" height="48" rx="8" fill="url(#gatewayGrad)"/>
      <text x="18" y="22" fill="#FFFFFF" font-size="13" font-weight="700">Envoy / Kong API Gateway</text>
      <text x="18" y="36" fill="#E9D5FF" font-size="11">Token Bucket Rate Limiting · TLS Termination</text>
    </g>

    <!-- Auth Service -->
    <g transform="translate(370, 40)">
      <rect width="270" height="48" rx="8" fill="#0F172A" stroke="#6D28D9" stroke-width="1.5"/>
      <text x="18" y="22" fill="#F1F5F9" font-size="13" font-weight="600">OAuth 2.0 / OIDC Service</text>
      <text x="18" y="36" fill="#94A3B8" font-size="11">JWT Validation · Role &amp; Scope ACL</text>
    </g>

    <!-- GraphQL BFF -->
    <g transform="translate(665, 40)">
      <rect width="295" height="48" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="18" y="22" fill="#F1F5F9" font-size="13" font-weight="600">GraphQL Federation / REST BFF</text>
      <text x="18" y="36" fill="#94A3B8" font-size="11">Payload Aggregation · Field Selection</text>
    </g>

    <!-- Circuit Breaker -->
    <g transform="translate(985, 40)">
      <rect width="270" height="48" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="18" y="22" fill="#F1F5F9" font-size="13" font-weight="600">Resilience &amp; Service Mesh</text>
      <text x="18" y="36" fill="#94A3B8" font-size="11">Istio Mesh · Automatic Retry · Fallback</text>
    </g>
  </g>

  <!-- LAYER 3: CORE DOMAIN MICROSERVICES (Y: 380 - 540) -->
  <g transform="translate(60, 380)">
    <rect width="1280" height="160" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="24" y="28" fill="#34D399" font-size="12" font-weight="700" letter-spacing="1">LAYER 3: CORE DOMAIN MICROSERVICES (KUBERNETES EKS CLUSTER)</text>

    <!-- Service 1: Search & Discovery -->
    <g transform="translate(24, 45)">
      <rect width="195" height="95" rx="8" fill="url(#serviceGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="6" fill="#38BDF8" rx="3"/>
      <text x="14" y="28" fill="#F8FAFC" font-size="13" font-weight="700">Search &amp; Discovery</text>
      <text x="14" y="46" fill="#94A3B8" font-size="11">Geo-spatial Indexing</text>
      <text x="14" y="62" fill="#94A3B8" font-size="11">Polygon Search &amp; Filter</text>
      <text x="14" y="78" fill="#38BDF8" font-size="10">Elasticsearch Shards</text>
    </g>

    <!-- Service 2: Listing Management -->
    <g transform="translate(235, 45)">
      <rect width="195" height="95" rx="8" fill="url(#serviceGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="195" height="6" fill="#A855F7" rx="3"/>
      <text x="14" y="28" fill="#F8FAFC" font-size="13" font-weight="700">Listing Service</text>
      <text x="14" y="46" fill="#94A3B8" font-size="11">Property Metadata</text>
      <text x="14" y="62" fill="#94A3B8" font-size="11">Photo Tour Categorizer</text>
      <text x="14" y="78" fill="#A855F7" font-size="10">CQRS Read Model</text>
    </g>

    <!-- Service 3: Booking & Reservation Engine -->
    <g transform="translate(445, 45)">
      <rect width="210" height="95" rx="8" fill="url(#serviceGrad)" stroke="#FF385C" stroke-width="1.5"/>
      <rect x="0" y="0" width="210" height="6" fill="#FF385C" rx="3"/>
      <text x="14" y="28" fill="#FF385C" font-size="13" font-weight="800">Booking Engine</text>
      <text x="14" y="46" fill="#F1F5F9" font-size="11">Distributed Lock (Redlock)</text>
      <text x="14" y="62" fill="#94A3B8" font-size="11">Saga Orchestration (2PC)</text>
      <text x="14" y="78" fill="#F43F5E" font-size="10">Zero Double-Booking Guarantee</text>
    </g>

    <!-- Service 4: Dynamic Pricing & Availability -->
    <g transform="translate(670, 45)">
      <rect width="190" height="95" rx="8" fill="url(#serviceGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="6" fill="#F59E0B" rx="3"/>
      <text x="14" y="28" fill="#F8FAFC" font-size="13" font-weight="700">Pricing &amp; Calendar</text>
      <text x="14" y="46" fill="#94A3B8" font-size="11">Dynamic Nightly Rate</text>
      <text x="14" y="62" fill="#94A3B8" font-size="11">Discounts &amp; Cleaning Fee</text>
      <text x="14" y="78" fill="#F59E0B" font-size="10">iCal Sync Worker</text>
    </g>

    <!-- Service 5: Payment & Vault -->
    <g transform="translate(875, 45)">
      <rect width="190" height="95" rx="8" fill="url(#serviceGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="6" fill="#10B981" rx="3"/>
      <text x="14" y="28" fill="#F8FAFC" font-size="13" font-weight="700">Payment &amp; Ledger</text>
      <text x="14" y="46" fill="#94A3B8" font-size="11">PCI-DSS Token Vault</text>
      <text x="14" y="62" fill="#94A3B8" font-size="11">Idempotency Keys</text>
      <text x="14" y="78" fill="#10B981" font-size="10">Stripe / Adyen Gateway</text>
    </g>

    <!-- Service 6: Reviews & Trust -->
    <g transform="translate(1080, 45)">
      <rect width="175" height="95" rx="8" fill="url(#serviceGrad)" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="0" width="175" height="6" fill="#EC4899" rx="3"/>
      <text x="14" y="28" fill="#F8FAFC" font-size="13" font-weight="700">Reviews &amp; Trust</text>
      <text x="14" y="46" fill="#94A3B8" font-size="11">Verified Guest Feedback</text>
      <text x="14" y="62" fill="#94A3B8" font-size="11">Superhost Score Engine</text>
      <text x="14" y="78" fill="#EC4899" font-size="10">Sentiment Analysis</text>
    </g>
  </g>

  <!-- LAYER 4: ASYNC EVENT STREAMING (Y: 570 - 670) -->
  <g transform="translate(60, 570)">
    <rect width="1280" height="100" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="24" y="28" fill="#FBBF24" font-size="12" font-weight="700" letter-spacing="1">LAYER 4: ASYNCHRONOUS EVENT STREAMING &amp; MESSAGING (APACHE KAFKA CLUSTER)</text>

    <!-- Kafka Cluster Box -->
    <g transform="translate(24, 40)">
      <rect width="400" height="48" rx="8" fill="url(#eventGrad)"/>
      <text x="18" y="22" fill="#FFFFFF" font-size="13" font-weight="700">Apache Kafka Distributed Event Log</text>
      <text x="18" y="36" fill="#FEF3C7" font-size="11">Topics: bookings.v1 · payments.v1 · listings.updates · notifications</text>
    </g>

    <!-- Worker 1: Notification Engine -->
    <g transform="translate(445, 40)">
      <rect width="250" height="48" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
      <text x="16" y="22" fill="#F1F5F9" font-size="13" font-weight="600">Notification Worker</text>
      <text x="16" y="36" fill="#94A3B8" font-size="11">Email (SendGrid) · SMS (Twilio) · Push</text>
    </g>

    <!-- Worker 2: Search Sync Worker -->
    <g transform="translate(715, 40)">
      <rect width="265" height="48" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
      <text x="16" y="22" fill="#F1F5F9" font-size="13" font-weight="600">Elasticsearch River Sync</text>
      <text x="16" y="36" fill="#94A3B8" font-size="11">CDC Debezium Stream to OpenSearch</text>
    </g>

    <!-- Worker 3: Analytics / Data Warehouse -->
    <g transform="translate(1000, 40)">
      <rect width="255" height="48" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
      <text x="16" y="22" fill="#F1F5F9" font-size="13" font-weight="600">Data Lakehouse Ingestion</text>
      <text x="16" y="36" fill="#94A3B8" font-size="11">Snowflake / ClickHouse Realtime BI</text>
    </g>
  </g>

  <!-- LAYER 5: STORAGE, CACHE & PERSISTENCE (Y: 700 - 830) -->
  <g transform="translate(60, 700)">
    <rect width="1280" height="130" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="24" y="28" fill="#2DD4BF" font-size="12" font-weight="700" letter-spacing="1">LAYER 5: PERSISTENCE, CACHING &amp; MULTI-REGION DATA TIERS</text>

    <!-- Primary OLTP Database -->
    <g transform="translate(24, 42)">
      <rect width="290" height="72" rx="8" fill="url(#dataGrad)"/>
      <text x="18" y="24" fill="#FFFFFF" font-size="13" font-weight="700">PostgreSQL (Amazon Aurora)</text>
      <text x="18" y="40" fill="#CCFBF1" font-size="11">ACID Booking Transactions · Multi-AZ Shards</text>
      <text x="18" y="56" fill="#99F6E4" font-size="10">Read Replicas with PgBouncer Pooling</text>
    </g>

    <!-- In-Memory Distributed Cache -->
    <g transform="translate(330, 42)">
      <rect width="290" height="72" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="1.5"/>
      <text x="18" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Redis Enterprise Cluster</text>
      <text x="18" y="40" fill="#94A3B8" font-size="11">Distributed Locks · Session Store</text>
      <text x="18" y="56" fill="#2DD4BF" font-size="10">Sub-millisecond Price &amp; Calendar Cache</text>
    </g>

    <!-- Search Engine -->
    <g transform="translate(635, 42)">
      <rect width="290" height="72" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="1.5"/>
      <text x="18" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Elasticsearch / OpenSearch</text>
      <text x="18" y="40" fill="#94A3B8" font-size="11">Distributed Geo-cluster with Replicas</text>
      <text x="18" y="56" fill="#2DD4BF" font-size="10">Fast Spatial Bounding Box Queries</text>
    </g>

    <!-- Blob Storage -->
    <g transform="translate(940, 42)">
      <rect width="315" height="72" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="1.5"/>
      <text x="18" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Amazon S3 Multi-Region</text>
      <text x="18" y="40" fill="#94A3B8" font-size="11">High-Res Property Photos · Document Vault</text>
      <text x="18" y="56" fill="#2DD4BF" font-size="10">Intelligent Tiering + CloudFront Origin</text>
    </g>
  </g>

  <!-- LAYER 6: OBSERVABILITY, CI/CD & INFRASTRUCTURE (Y: 850 - 930) -->
  <g transform="translate(60, 850)">
    <rect width="1280" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="25" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1">DEPLOYMENT, OBSERVABILITY &amp; SRE PILLARS</text>
    <g transform="translate(24, 35)">
      <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="500">Infrastructure as Code: <tspan fill="#38BDF8">Terraform / AWS CDK</tspan></text>
      <text x="320" y="16" fill="#E2E8F0" font-size="12" font-weight="500">CI/CD Pipeline: <tspan fill="#A855F7">GitHub Actions &amp; ArgoCD GitOps</tspan></text>
      <text x="690" y="16" fill="#E2E8F0" font-size="12" font-weight="500">Metrics &amp; Traces: <tspan fill="#F59E0B">Prometheus, Grafana &amp; OpenTelemetry</tspan></text>
      <text x="1050" y="16" fill="#E2E8F0" font-size="12" font-weight="500">SLA: <tspan fill="#10B981">99.99% Availability</tspan></text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <path d="M 700 220 L 700 250" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 700 350 L 700 380" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 540 L 550 570" stroke="#FF385C" stroke-width="2" marker-end="url(#arrowPrimary)"/>
  <path d="M 700 670 L 700 700" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>
</svg>
